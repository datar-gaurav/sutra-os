[project]
name = "sutra-backend"
version = "0.1.0"
description = "Sutra AI Agent Orchestrator — Backend"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "litellm>=1.50.0",
    "slack-bolt>=1.20.0",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "cryptography>=43.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "websockets>=13.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pywa[fastapi]>=2.0.0",
    "PyGithub>=2.5.0",
    "gitpython>=3.1.40",
    "playwright>=1.42.0",
    "beautifulsoup4>=4.12.0",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "apscheduler>=3.10.0",
    "pytz>=2024.0",
    "python-telegram-bot>=21.0.0",
    "mcp>=1.0.0",
    "slowapi>=0.1.9",
    "email-validator>=2.0.0",
    "pypdf>=4.0.0",
    "pytrends>=4.9.0",
    "docker>=7.0.0",
]

[project.scripts]
sutra-gemini = "app.cli.gemini:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["app", "app.cli"]
