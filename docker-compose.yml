version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sutra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sutra_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sutra}
    # ports:          # Uncomment for local debugging only
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sutra" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # ports:          # Uncomment for local debugging only
    #   - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-init:
    # One-shot: ensure the `mlflow` database exists in the shared Postgres instance.
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sutra_dev}
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h db -U ${POSTGRES_USER:-sutra} -tc "SELECT 1 FROM pg_database WHERE datname='mlflow'"
        | grep -q 1 || psql -h db -U ${POSTGRES_USER:-sutra} -c "CREATE DATABASE mlflow"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.0.0
    ports:
      # Host 5001 → container 5000. macOS reserves :5000 for AirPlay Receiver.
      - "5001:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-sutra}:${POSTGRES_PASSWORD:-sutra_dev}@db:5432/mlflow
    entrypoint: ["sh", "-c"]
    command:
      - |
        pip install psycopg2-binary >/dev/null 2>&1 \
        && mlflow server \
             --host 0.0.0.0 --port 5000 \
             --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" \
             --artifacts-destination /mlflow-artifacts \
             --serve-artifacts
    volumes:
      - mlflow-artifacts:/mlflow-artifacts
    depends_on:
      db:
        condition: service_healthy
      mlflow-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sutra}:${POSTGRES_PASSWORD:-sutra_dev}@db:5432/${POSTGRES_DB:-sutra}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLFLOW_ENABLED: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    # start.sh is the ENTRYPOINT; override command with ["--reload"] in dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_DEV: "0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # start.sh is the ENTRYPOINT — no command needed

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sutra}:${POSTGRES_PASSWORD:-sutra_dev}@db:5432/${POSTGRES_DB:-sutra}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLFLOW_ENABLED: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    entrypoint: []
    command: celery -A app.worker worker --loglevel=info

volumes:
  pgdata:
  mlflow-artifacts:
